<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Planner</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/script.js" defer></script>
</head>
<body>
    <main>
        <h1>Nexora Planner</h1>
        <p>Sistema de planejamento e gerenciamento de tarefas</p>

        <form id="formTarefa">
            <label for="nometarefa">Nome da tarefa:</label>
            <input type="text" id="nometarefa" placeholder="Digite o nome da tarefa" required>

            <label for="datalimite">Data limite:</label>
            <input type="date" id="datalimite" required>

            <label for="duracao">Duração estimada em minutos:</label>
            <input type="number" id="duracao" placeholder="Duração estimada" min="1" step="1" required>

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade">
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
            </select>

            <button id="btnAdicionar" type="submit">Adicionar tarefa</button>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <section aria-labelledby="tituloTarefas">
            <h2 id="tituloTarefas">Tarefas</h2>
            <p id="listaVazia">Nenhuma tarefa cadastrada.</p>
            <ul id="listaTarefas"></ul>
        </section>
    </main>
</body>
</html>
